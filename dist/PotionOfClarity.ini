[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[General]

; How much a Potion of Clarity costs - its gold value, which is what merchants charge for it
; (and pay for it), 0 to 1000. Applied when the game loads and whenever you change it in the menu.
uPrice=500

; Static Skill Leveling Rewritten compatibility: 1 = drinking the potion ALSO resets every
; trained skill to its starting value (15 + racial bonus) and returns the skill points SSLR
; charged for the levels above it to SSLR's pool
; (spent again at your next level-up). 0 = perks only. Ignored when SSLR is not installed.
bSSLRCompat=0
